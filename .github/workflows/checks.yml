name: Проверка дневника

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: docker build -t peremena:lesson .
      - name: Проверка запуска
        run: |
          docker run -d --name peremena-check peremena:lesson
          trap 'docker rm -f peremena-check' EXIT
          for attempt in $(seq 1 30); do
            if docker exec peremena-check python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'ok'; assert len(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/students'))['students']) == 3"; then
              exit 0
            fi
            sleep 1
          done
          docker logs peremena-check
          exit 1
